services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahayyam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sahayyam
      POSTGRES_PASSWORD: sahayyam
      POSTGRES_DB: sahayyam
    ports:
      - "5432:5432"
    volumes:
      - sahayyam-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sahayyam -d sahayyam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sahayyam-postgres-data:
